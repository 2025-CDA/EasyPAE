lexik_jwt_authentication:
    secret_key: '%env(resolve:JWT_SECRET_KEY)%'
    public_key: '%env(resolve:JWT_PUBLIC_KEY)%'
    pass_phrase: '%env(JWT_PASSPHRASE)%'
    token_ttl: 3600

    # This tells the authenticator which field in the JWT payload
    # corresponds to the user's identifier (the result of getUserIdentifier()).
    user_id_claim: email
